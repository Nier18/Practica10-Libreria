        <h1 class="mt-4">Registro de libros</h1>
        <h6>Llena los datos del libro nuevo.</h6>

        <form action="guardar.php" method="post" enctype="multipart/form-data">
            <div class="mb-3 mt-3">
                <label for="autor" class="form-label">Autor:</label>
                <input type="text" class="form-control" id="autor" placeholder="Ingrese el autor" name="autor" required>
            </div>
            <div class="mb-3">
                <label for="titulo" class="form-label">Título:</label>
                <input type="text" class="form-control" id="titulo" placeholder="Ingrese el título" name="titulo" required>
            </div>
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha de publicación:</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="mb-3">
                <label for="portada" class="form-label">Imagen de portada:</label>
                <input type="file" class="form-control" id="portada" name="portada" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-dark">Registrar</button>
        </form>
    </div>
